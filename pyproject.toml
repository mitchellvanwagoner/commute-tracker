[project]
name = "commute-tracker"
version = "0.3.0"
description = "Track and graph Google Maps driving times for a commute over a daily window"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }

[tool.setuptools.packages.find]
include = ["commute_tracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The package is used from the repo root rather than installed, so put the root
# on sys.path for a bare `pytest` invocation too.
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
