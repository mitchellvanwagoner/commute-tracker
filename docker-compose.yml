services:
  commute-tracker:
    # The prebuilt image from GitHub Container Registry, published by
    # .github/workflows/publish.yml.
    #
    # Deliberately no `build:` key. This file is meant to run on a host that has
    # the compose file and nothing else -- Unraid, a NAS, any box that never
    # cloned the repo. With a `build:` present, a failed pull does not stop:
    # compose quietly falls back to building and dies on the missing Dockerfile,
    # which buries the real error (the pull) under a confusing one.
    #
    # To run a local build instead, build it under this same name and compose
    # will use it: docker build -t ghcr.io/mitchellvanwagoner/commute-tracker .
    image: ghcr.io/mitchellvanwagoner/commute-tracker:latest
    container_name: commute-tracker
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Left side is the port on the Unraid/NAS host, and the only half worth
      # changing -- set PORT in .env. The right side is fixed: inside the
      # container the app always listens on 8080.
      - "${PORT:-8080}:8080"
    volumes:
      # Holds both the database and routes.yml, so routes added in the
      # dashboard survive a rebuild or a reboot.
      #
      # To keep the data somewhere you can browse instead, swap in a host path
      # (on Unraid: /mnt/user/appdata/commute-tracker:/data) and set PUID/PGID
      # in .env to that directory's owner -- 99:100 for Unraid appdata.
      # Ownership there is the host's, and the container must be able to write.
      - commute-data:/data
    environment:
      # These are pinned deliberately, and override anything in .env.
      #
      # HOST must be 0.0.0.0: it is the address the app binds *inside* the
      # container's own network namespace, which never holds the host's LAN
      # address. Setting it to the host's IP makes uvicorn fail to bind
      # ("Cannot assign requested address") and nothing listens at all --
      # which looks from outside exactly like a wrong port. Docker is what
      # bridges the host's IP to the container; the app takes no part in it.
      HOST: 0.0.0.0
      PORT: 8080
      DB_PATH: /data/commutes.db

volumes:
  commute-data:
