services:
  commute-tracker:
    build: .
    image: commute-tracker:latest
    container_name: commute-tracker
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      # Holds both the database and routes.yml, so routes added in the
      # dashboard survive a rebuild or a reboot.
      - commute-data:/data
    environment:
      PORT: 8080
      DB_PATH: /data/commutes.db

volumes:
  commute-data:
