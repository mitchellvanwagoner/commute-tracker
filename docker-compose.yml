services:
  commute-tracker:
    # The prebuilt image from GitHub Container Registry, published by
    # .github/workflows/publish.yml. `docker compose pull` fetches it; `docker
    # compose up --build` ignores it and builds from this checkout instead.
    image: ghcr.io/mitchellvanwagoner/commute-tracker:latest
    build: .
    container_name: commute-tracker
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      # Holds both the database and routes.yml, so routes added in the
      # dashboard survive a rebuild or a reboot.
      - commute-data:/data
    environment:
      PORT: 8080
      DB_PATH: /data/commutes.db

volumes:
  commute-data:
