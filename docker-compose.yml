services:
  commute-tracker:
    # The prebuilt image from GitHub Container Registry, published by
    # .github/workflows/publish.yml.
    #
    # Deliberately no `build:` key. This file is meant to run on a host that has
    # the compose file and nothing else -- Unraid, a NAS, any box that never
    # cloned the repo. With a `build:` present, a failed pull does not stop:
    # compose quietly falls back to building and dies on the missing Dockerfile,
    # which buries the real error (the pull) under a confusing one.
    #
    # To build from source instead, overlay docker-compose.build.yml.
    image: ghcr.io/mitchellvanwagoner/commute-tracker:latest
    container_name: commute-tracker
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      # Holds both the database and routes.yml, so routes added in the
      # dashboard survive a rebuild or a reboot.
      - commute-data:/data
    environment:
      PORT: 8080
      DB_PATH: /data/commutes.db

volumes:
  commute-data:
