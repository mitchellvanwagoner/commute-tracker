name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t commute-tracker:ci .
      - name: Container starts and answers /healthz
        run: |
          docker run -d --name ct -p 8080:8080 \
            -e GOOGLE_MAPS_API_KEY=ci-placeholder \
            -e DB_PATH=/tmp/ci.db \
            commute-tracker:ci
          for _ in $(seq 1 20); do
            if curl -fsS http://localhost:8080/healthz; then exit 0; fi
            sleep 1
          done
          docker logs ct
          exit 1
