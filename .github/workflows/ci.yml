name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t commute-tracker:ci .
      - name: Container starts and answers /healthz
        run: |
          docker run -d --name ct -p 8080:8080 \
            -e GOOGLE_MAPS_API_KEY=ci-placeholder \
            -e DB_PATH=/tmp/ci.db \
            commute-tracker:ci
          for _ in $(seq 1 20); do
            if curl -fsS http://localhost:8080/healthz; then exit 0; fi
            sleep 1
          done
          docker logs ct
          exit 1

      # The Unraid case, which is where this actually broke: /data is a bind
      # mount owned by nobody:users (99:100), not by the image's uid 1000.
      # Without PUID/PGID the app cannot open the database and the container
      # dies before serving anything.
      - name: A host directory owned by 99:100 works with PUID/PGID
        run: |
          set -euo pipefail
          mkdir -p /tmp/appdata
          sudo chown 99:100 /tmp/appdata
          docker run -d --name ct-unraid -p 8081:8080             -e GOOGLE_MAPS_API_KEY=ci-placeholder             -e PUID=99 -e PGID=100             -v /tmp/appdata:/data             commute-tracker:ci
          for _ in $(seq 1 20); do
            if curl -fsS http://localhost:8081/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8081/healthz || { docker logs ct-unraid; exit 1; }
          # The database must exist on the host, owned by the host's user.
          sudo test -f /tmp/appdata/commutes.db || { docker logs ct-unraid; exit 1; }
          owner=$(stat -c '%u:%g' /tmp/appdata/commutes.db)
          echo "database owner: $owner"
          test "$owner" = "99:100"

      # The opposite guarantee: the app itself must no longer be root.
      #
      # Read PID 1 rather than asking `docker exec`, which starts a fresh
      # process as the image's configured user (root, since the entrypoint needs
      # it) and would say nothing about the process actually serving requests.
      # The entrypoint execs all the way through, so PID 1 is the app.
      - name: The app does not run as root
        run: |
          uid=$(docker exec ct-unraid awk '/^Uid:/ {print $2}' /proc/1/status)
          comm=$(docker exec ct-unraid cat /proc/1/comm)
          echo "pid 1 is $comm running as uid $uid"
          test "$uid" = "99"

      # The compose file is the thing Unraid actually runs, and nothing above
      # touches it -- every step so far calls `docker run` with explicit -e
      # flags, which cannot reproduce how `env_file:` and `environment:`
      # interact.
      #
      # PORT is the trap. It means two different things: the host port to
      # publish, and the port the app binds inside. `${PORT}` in `ports:` is
      # interpolated from .env, while `environment:` pins PORT=8080 inside the
      # container -- so the two halves must disagree, and only that pin keeps
      # them apart. Drop it and .env's PORT reaches the app, uvicorn binds 8189
      # inside, the mapping still forwards host 8189 to container 8080, and
      # nothing listens there. The image's own HEALTHCHECK curls $PORT too, so
      # it follows the app to 8189 and reports healthy the whole time.
      #
      # Hence a host port deliberately unequal to 8080: reaching /healthz on
      # 8189 from outside is only possible if the app bound 8080 inside.
      - name: The compose file publishes a host port that is not the app's
        run: |
          set -euo pipefail
          # No `build:` key, by design -- build under the name compose expects.
          docker build -t ghcr.io/mitchellvanwagoner/commute-tracker:latest .
          cat > .env <<'EOF'
          GOOGLE_MAPS_API_KEY=ci-placeholder
          PORT=8189
          EOF
          docker compose up -d
          for _ in $(seq 1 20); do
            if curl -fsS http://localhost:8189/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8189/healthz || {
            docker compose ps
            docker compose logs
            exit 1
          }
          # Says the same thing from the inside, so a failure names the cause
          # rather than just "the port is shut".
          docker compose exec -T commute-tracker \
            curl -fsS http://localhost:8080/healthz > /dev/null || {
            echo "app is not listening on 8080 inside the container -- PORT leaked in"
            docker compose logs
            exit 1
          }
          docker compose down -v
