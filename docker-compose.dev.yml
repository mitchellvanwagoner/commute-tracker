# Development overlay:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Differences from the production compose file: the source is bind-mounted and
# uvicorn reloads on edit, and data lands in ./data on the host rather than in a
# named volume, so the database and routes.yml can be inspected and thrown away
# like any other local file.
services:
  commute-tracker:
    build: .
    volumes:
      - ./commute_tracker:/app/commute_tracker:ro
      - ./data:/data
    environment:
      PORT: 8080
      DB_PATH: /data/commutes.db
      ROUTES_FILE: /data/routes.yml
    command:
      - python
      - -m
      - uvicorn
      - commute_tracker.web.app:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --reload
      - --reload-dir
      - /app/commute_tracker
