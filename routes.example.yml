# Optional. Copy to routes.yml to start with more than one commute.
#
# This is a SEED, used only when the database is first created: it replaces the
# single route defined in .env. From then on routes are managed in the dashboard
# and this file is ignored, so edits made in the UI survive a restart.
# (GOOGLE_MAPS_API_KEY always comes from the environment.)

defaults:
  timezone: America/Los_Angeles
  interval_minutes: 15
  days: mon,tue,wed,thu,fri

routes:
  - name: Morning commute
    origin: 1600 Amphitheatre Parkway, Mountain View, CA
    destination: 1 Ferry Building, San Francisco, CA
    window_start: "07:00"
    window_end: "09:00"

  - name: Evening commute
    origin: 1 Ferry Building, San Francisco, CA
    destination: 1600 Amphitheatre Parkway, Mountain View, CA
    window_start: "16:30"
    window_end: "18:30"
    interval_minutes: 10

# Per-route notification timing is also supported:
#
#   - name: Morning commute
#     ...
#     notify_at: "09:30"
#     notify_days: mon,tue,wed,thu,fri
