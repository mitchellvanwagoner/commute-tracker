# An example of the file the dashboard writes and reads.
#
# You do not need to create this by hand: add routes in the dashboard and it is
# written for you, at /data/routes.yml inside the container (beside the
# database) unless ROUTES_FILE says otherwise. Copy this to that path to start
# with routes already defined, or hand-edit the live file -- changes on disk are
# picked up without a restart.
#
# Keep a route's `id` to keep its collected history: the id is what samples are
# recorded against, so renaming a route is safe but changing its id orphans its
# data. `defaults` apply to every route that does not override them.
#
# Times must be quoted, or YAML reads 16:30 as a number.

defaults:
  timezone: America/Los_Angeles
  interval_minutes: 15
  days: mon,tue,wed,thu,fri

routes:
  - id: morning-commute
    name: Morning commute
    origin: 1600 Amphitheatre Parkway, Mountain View, CA
    destination: 1 Ferry Building, San Francisco, CA
    window_start: "07:00"
    window_end: "09:00"
    notify_at: "09:30"
    enabled: true

  - id: evening-commute
    name: Evening commute
    origin: 1 Ferry Building, San Francisco, CA
    destination: 1600 Amphitheatre Parkway, Mountain View, CA
    window_start: "16:30"
    window_end: "18:30"
    interval_minutes: 10
    notify_at: "19:00"
    enabled: true
