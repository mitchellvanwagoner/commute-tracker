# Build from this checkout instead of pulling the published image:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Only useful where the repository is checked out. The plain docker-compose.yml
# deliberately has no build section so that a deployment host fails on the real
# error -- a failed pull -- rather than on a missing Dockerfile.
services:
  commute-tracker:
    build: .
